# Render Blueprint — AI Maintenance Safety & Quality Monitor backend.
# Deploy: push this repo to GitHub, then on Render choose
#   New + -> Blueprint -> connect the repo -> apply.
# Render provisions the PostgreSQL database and wires DATABASE_URL automatically.
databases:
  - name: amsq-postgres
    plan: free
    databaseName: amsq
    user: amsq

services:
  - type: web
    name: amsq-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: ai-maintenance-backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: amsq-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AI_MODE
        value: demo
      - key: SEED_DEMO_DATA
        value: "true"
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        sync: false
        value: '["http://localhost:5173","https://ai-monitor.vercel.app"]'
      - key: PYTHON_VERSION
        value: "3.11.9"
